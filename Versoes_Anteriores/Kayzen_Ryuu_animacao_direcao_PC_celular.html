<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kayzen Ryuu — Vertical Slice</title>
<style>
html,body{margin:0;height:100%;background:#05060d;color:#cfeaff;font-family:system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}
#wrap{display:flex;align-items:center;justify-content:center;height:100%}
canvas{background:#080a14;width:min(100vw,177.78vh);height:auto;max-width:100vw;max-height:100vh;aspect-ratio:16/9;box-shadow:0 0 40px #00e5ff33;border:1px solid #0b3a4a;image-rendering:auto}
#mobileJoystick{display:none;position:fixed;left:24px;bottom:24px;width:116px;height:116px;border:1.5px solid rgba(255,255,255,.22);border-radius:50%;background:transparent;box-shadow:none;z-index:20;touch-action:none;user-select:none;-webkit-user-select:none;opacity:.52}
#mobileJoystick .stick{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px;border:1.5px solid rgba(255,255,255,.38);border-radius:50%;background:transparent;box-shadow:none;pointer-events:none;backdrop-filter:none}
#mobileJoystick:active{opacity:.72}
.mobile-control{display:none;position:fixed;z-index:21;border:2px solid #8df5ff;border-radius:50%;color:#eaffff;font-weight:900;text-shadow:0 1px 5px #00131a;background:radial-gradient(circle at 35% 30%,#14b9d0,#07516c 75%);box-shadow:0 0 22px #00e5ff66;touch-action:none;user-select:none;-webkit-user-select:none}
#mobileFire{right:26px;bottom:28px;width:88px;height:88px;font-size:17px;border-color:#ff9b9b;background:radial-gradient(circle at 35% 30%,#ff7777,#8d102b 75%);box-shadow:0 0 22px #ff304866}
#mobileReload{right:42px;bottom:132px;width:58px;height:58px;font-size:12px}
#mobileJump{right:132px;bottom:34px;width:72px;height:72px;font-size:14px;border-color:#9bffb0;background:radial-gradient(circle at 35% 30%,#45d879,#12612e 75%);box-shadow:0 0 22px #32ff6a55}
#rotateNotice{display:none;position:fixed;inset:0;z-index:50;background:#05060d;color:#eaffff;align-items:center;justify-content:center;text-align:center;padding:28px;font-weight:800;font-size:20px}
@media (pointer:coarse) and (orientation:portrait){#rotateNotice{display:flex}#wrap,#mobileJoystick,#mobileFire,#mobileReload,#mobileJump{visibility:hidden}}
@media (pointer:coarse) and (orientation:landscape){#mobileJoystick,.mobile-control{display:block}}
@media (pointer:coarse){canvas{width:min(100vw,177.78vh);max-height:100vh;touch-action:none}}
/* Analógico no mesmo visual neutro/transparente dos botões de ação. */
#mobileJoystick {
  border-color: rgba(230,245,255,.34) !important;
  background: rgba(5,10,20,.12) !important;
  box-shadow: none !important;
  opacity: .9 !important;
}
#mobileJoystick .stick {
  visibility: visible !important;
  border-color: rgba(230,245,255,.48) !important;
  background: rgba(230,245,255,.12) !important;
  box-shadow: none !important;
}
#mobileJoystick:active { opacity: 1 !important; }
/* Botões da direita sem preenchimento colorido; texto continua legível. */
.mobile-control,
#mobileFire,
#mobileReload,
#mobileJump {
  background: rgba(5,10,20,.12) !important;
  border-color: rgba(230,245,255,.34) !important;
  box-shadow: none !important;
  color: rgba(255,255,255,.94) !important;
  text-shadow: 0 1px 4px rgba(0,0,0,.9) !important;
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}
</style>
</head>

let loaded=0;
for(const k in SPR){const i=new Image();i.onload=()=>{if(++loaded===5){buildTints();start();}};i.src="data:image/png;base64,"+SPR[k].d;IMG[k]=i;}

/* gera uma folha de sprites recolorida para cada tipo (gira só os matizes quentes/roxos: preserva a caveira) */
function buildTints(){
  const src=IMG.malware;
  for(const k in ETYPES){
    const c=document.createElement('canvas');c.width=src.width;c.height=src.height;
    const g=c.getContext('2d');g.drawImage(src,0,0);
    const id=g.getImageData(0,0,c.width,c.height),d=id.data,sh=ETYPES[k].hue;
    for(let i=0;i<d.length;i+=4){
      if(d[i+3]===0)continue;
      let r=d[i]/255,gg=d[i+1]/255,b=d[i+2]/255;
      const mx=Math.max(r,gg,b),mn=Math.min(r,gg,b),l=(mx+mn)/2,df=mx-mn;
      if(df===0)continue;
      const sat=l>0.5?df/(2-mx-mn):df/(mx+mn);
      let h=mx===r?((gg-b)/df+(gg<b?6:0)):mx===gg?((b-r)/df+2):((r-gg)/df+4);h*=60;
      if(sat<0.2||!(h>=250||h<=60))continue;
      h=(h+sh)%360;
      const q=l<.5?l*(1+sat):l+sat-l*sat,p=2*l-q,f=t=>{t=(t+360)%360/360;return t<1/6?p+(q-p)*6*t:t<.5?q:t<2/3?p+(q-p)*(2/3-t)*6:p;};
      d[i]=f(h+120)*255;d[i+1]=f(h)*255;d[i+2]=f(h-120)*255;
    }
    g.putImageData(id,0,0);
    IMG['m_'+k]=c;SPR['m_'+k]={w:SPR.malware.w,h:SPR.malware.h,n:SPR.malware.n};
  }
}

/* ============ ENTRADA ============ */
const keys={};let mouse={x:VW/2,y:VH/2,down:false};
// Controles touch: o analógico só aparece em dispositivos com entrada por toque.
const joystickEl=document.getElementById('mobileJoystick');
const joystickStick=joystickEl.querySelector('.stick');
const touchDevice=window.matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window && navigator.maxTouchPoints>0);
let joystick={x:0,y:0,pointerId:null};
const mobileFireBtn=document.getElementById('mobileFire');
const mobileReloadBtn=document.getElementById('mobileReload');
const mobileJumpBtn=document.getElementById('mobileJump');
let mobileFire=false;
if(!touchDevice){joystickEl.style.display='none';mobileFireBtn.style.display='none';mobileReloadBtn.style.display='none';mobileJumpBtn.style.display='none';}
function setMobileAim(){if(!P)return;mouse.x=P.x-cam.x+P.face*320;mouse.y=P.y-cam.y-34;}
if(touchDevice){
  mobileFireBtn.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();mobileFire=true;setMobileAim();mobileFireBtn.setPointerCapture(e.pointerId);});
  const stopMobileFire=e=>{mobileFire=false;};
  mobileFireBtn.addEventListener('pointerup',stopMobileFire);mobileFireBtn.addEventListener('pointercancel',stopMobileFire);mobileFireBtn.addEventListener('lostpointercapture',stopMobileFire);
  mobileReloadBtn.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();if(state!=='play')reset();else if(!paused&&P&&P.ammo<CFG.ammoMax&&P.reloadT<=0){P.reloadT=CFG.reloadTime;startWeaponReloadAudio();}});
  mobileJumpBtn.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();doJump();});
  // Solicita orientação horizontal quando o navegador permitir.
  const requestLandscape=()=>{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});};
  document.addEventListener('pointerdown',requestLandscape,{once:true});
}
function moveJoystick(e){
  const r=joystickEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=e.clientX-cx,dy=e.clientY-cy;const max=43,d=Math.hypot(dx,dy);
  if(d>max){dx=dx/d*max;dy=dy/d*max;}
  joystick.x=dx/max;joystick.y=dy/max;
  joystickStick.style.transform=`translate(${dx}px,${dy}px)`;
}
function releaseJoystick(e){if(joystick.pointerId!==e.pointerId)return;joystick.pointerId=null;joystick.x=joystick.y=0;joystickStick.style.transform='translate(0px,0px)';}
if(touchDevice){
  joystickEl.addEventListener('pointerdown',e=>{e.preventDefault();joystick.pointerId=e.pointerId;joystickEl.setPointerCapture(e.pointerId);moveJoystick(e);});
  joystickEl.addEventListener('pointermove',e=>{if(joystick.pointerId===e.pointerId){e.preventDefault();moveJoystick(e);}});
  joystickEl.addEventListener('pointerup',releaseJoystick);joystickEl.addEventListener('pointercancel',releaseJoystick);
}
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(!keys[e.code]){
    if(e.code==='Escape'&&skill.aiming){skill.aiming=false;sfx('aimOff');}
    else if(e.code==='KeyP'||e.code==='Escape'){paused=!paused;if(paused)skill.aiming=false;}
    if(e.code==='KeyQ')toggleAim();
    if(e.code==='KeyM'){muted=!muted;if(master)master.gain.value=muted?0:0.5;}
    if(e.code==='KeyH')showBoxes=!showBoxes;
    if(e.code==='Space')doJump();
    if(e.code==='KeyR'){
      if(state!=='play')reset();
      else if(!paused&&P&&P.ammo<CFG.ammoMax&&P.reloadT<=0){
        P.reloadT=CFG.reloadTime;
        startWeaponReloadAudio();
      }
    }
  }
  keys[e.code]=true;});
addEventListener('keyup',e=>keys[e.code]=false);
function setMouse(e){const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)*VW/r.width;mouse.y=(e.clientY-r.top)*VH/r.height;}
cv.addEventListener('mousemove',setMouse);
// No celular, a área roxa da Sobrecarga acompanha o dedo: arraste para posicionar
// e solte para confirmar o lançamento. Isso evita a mira ficar presa na posição inicial.
let skillAimPointerId=null;
if(touchDevice){
  cv.addEventListener('pointerdown',e=>{
    if(!skill.aiming||e.pointerType==='mouse')return;
    e.preventDefault();audioInit();setMouse(e);skillAimPointerId=e.pointerId;
    try{cv.setPointerCapture(e.pointerId);}catch(_){}
  });
  cv.addEventListener('pointermove',e=>{
    if(skillAimPointerId!==e.pointerId)return;
    e.preventDefault();setMouse(e);
  });
  const finishTouchAim=e=>{
    if(skillAimPointerId!==e.pointerId)return;
    e.preventDefault();setMouse(e);skillAimPointerId=null;
    if(skill.aiming)confirmAim();
  };
  cv.addEventListener('pointerup',finishTouchAim);
  cv.addEventListener('pointercancel',e=>{if(skillAimPointerId===e.pointerId)skillAimPointerId=null;});
}
cv.addEventListener('mousedown',e=>{
  setMouse(e);
  if(e.button===2){if(skill.aiming){skill.aiming=false;sfx('aimOff');}return;}   // botão direito cancela a mira
  if(overIcon()){toggleAim();return;}            // clicou no ícone da habilidade
  if(skill.aiming){confirmAim();return;}         // com a mira ativa, o clique lança o ataque
  mouse.down=true;});cv.addEventListener('contextmenu',e=>e.preventDefault());addEventListener('mouseup',()=>mouse.down=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.down=false;mobileFire=false;});

// Paredes sólidas (prédios/containers). [x,y,w,h]
const baseWalls=[
  [380,260,260,160],[900,120,200,300],[1500,300,320,140],[1900,150,260,220],
  [300,820,220,300],[820,760,360,120],[1380,860,160,360],[1800,820,420,160],
  [1000,1180,300,140],[500,1260,220,120]
];
const baseLights=[[640,420],[1100,430],[1830,440],[520,1110],[1200,880],[1540,1230],[2160,980],[240,300]];
const walls=[[0,-40,WW,40],[0,WH,WW,40],[-40,0,40,WH],[WW,0,40,WH]]; // bordas
const lights=[];
for(let ty=0;ty<MAP_SCALE;ty++)for(let tx=0;tx<MAP_SCALE;tx++){
  const ox=tx*TILE_W,oy=ty*TILE_H;
  baseWalls.forEach(([x,y,w,h])=>walls.push([x+ox,y+oy,w,h]));
  baseLights.forEach(([x,y])=>lights.push([x+ox,y+oy]));
}
let floorCanvas;
function rng(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}

function buildFloor(){
  floorCanvas=document.createElement('canvas');floorCanvas.width=WW;floorCanvas.height=WH;
  const g=floorCanvas.getContext('2d'),R=rng(20261030);
  // Asfalto urbano escuro, com textura irregular e sem grade holográfica.
  g.fillStyle='#10131a';g.fillRect(0,0,WW,WH);
  for(let i=0;i<Math.floor(WW*WH/1700);i++){
    const x=R()*WW,y=R()*WH,w=2+R()*18,h=1+R()*5;
    g.fillStyle=R()<.5?'rgba(190,205,215,.025)':'rgba(0,0,0,.075)';
    g.fillRect(x,y,w,h);
  }
  // Ruas largas, guias e calçadas com juntas de concreto.
  for(let oy=0;oy<WH;oy+=TILE_H){
    const ry=540+oy;
    g.fillStyle='#171b22';g.fillRect(0,ry,WW,150);
    g.fillStyle='#30343a';g.fillRect(0,ry-12,WW,12);g.fillRect(0,ry+150,WW,12);
    g.fillStyle='#20252c';
    for(let x=0;x<WW;x+=48){g.fillRect(x,ry-11,1,10);g.fillRect(x,ry+151,1,10);}
    g.strokeStyle='rgba(211,190,125,.36)';g.lineWidth=2;g.setLineDash([28,34]);
    g.beginPath();g.moveTo(0,ry+75);g.lineTo(WW,ry+75);g.stroke();g.setLineDash([]);
    // marcas de desgaste e remendos no asfalto
    for(let j=0;j<Math.ceil(WW/130);j++){
      const x=R()*WW,y=ry+R()*150;
      g.fillStyle='rgba(0,0,0,.12)';g.beginPath();g.ellipse(x,y,18+R()*35,3+R()*5,R()*.3,0,Math.PI*2);g.fill();
    }
  }
  for(let ox=0;ox<WW;ox+=TILE_W){
    const rx=740+ox;
    g.fillStyle='#171b22';g.fillRect(rx,0,110,WH);
    g.fillStyle='#30343a';g.fillRect(rx-12,0,12,WH);g.fillRect(rx+110,0,12,WH);
    g.fillStyle='#20252c';
    for(let y=0;y<WH;y+=48){g.fillRect(rx-11,y,10,1);g.fillRect(rx+111,y,10,1);}
    g.strokeStyle='rgba(211,190,125,.34)';g.lineWidth=2;g.setLineDash([28,34]);
    g.beginPath();g.moveTo(rx+55,0);g.lineTo(rx+55,WH);g.stroke();g.setLineDash([]);
  }
  // Faixas de pedestres em cruzamentos.
  for(let oy=0;oy<WH;oy+=TILE_H)for(let ox=0;ox<WW;ox+=TILE_W){
    const cx=740+ox,cy=540+oy;
    g.fillStyle='rgba(205,211,215,.42)';
    for(let k=0;k<7;k++){g.fillRect(cx-48+k*15,cy+13,8,28);g.fillRect(cx-48+k*15,cy+109,8,28);}
    for(let k=0;k<6;k++){g.fillRect(cx+12,cy-42+k*14,28,7);g.fillRect(cx+70,cy-42+k*14,28,7);}
  }
  // Tampas de bueiro, grelhas de drenagem, rachaduras e poças discretas.
  for(let i=0;i<Math.max(20,Math.floor(WW*WH/70000));i++){
    const x=R()*WW,y=R()*WH,r=9+R()*10;
    g.fillStyle='#0b0e13';g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();
    g.strokeStyle='rgba(145,154,160,.34)';g.lineWidth=2;g.beginPath();g.arc(x,y,r-2,0,Math.PI*2);g.stroke();
    g.strokeStyle='rgba(145,154,160,.25)';g.lineWidth=1;
    for(let a=-r+4;a<r;a+=5){g.beginPath();g.moveTo(x-r*.65,y+a);g.lineTo(x+r*.65,y+a);g.stroke();}
  }
  for(let i=0;i<26*MAP_SCALE*MAP_SCALE;i++){
    const x=R()*WW,y=R()*WH,rx=12+R()*42,ry=4+R()*13;
    g.fillStyle='rgba(0,0,0,.24)';g.beginPath();g.ellipse(x+2,y+3,rx,ry,0,0,Math.PI*2);g.fill();
    const gr=g.createLinearGradient(x-rx,y-ry,x+rx,y+ry);
    gr.addColorStop(0,'rgba(90,125,145,.025)');gr.addColorStop(.5,R()<.5?'rgba(0,185,205,.13)':'rgba(190,70,145,.10)');gr.addColorStop(1,'rgba(90,125,145,.02)');
    g.fillStyle=gr;g.beginPath();g.ellipse(x,y,rx,ry,R()*.3,0,Math.PI*2);g.fill();
  }
  // Iluminação refletida no chão, contida para não parecer uma arena neon.
  for(const [x,y] of lights){
    const gr=g.createRadialGradient(x,y,3,x,y,125);
    gr.addColorStop(0,'rgba(0,190,205,.10)');gr.addColorStop(1,'rgba(0,190,205,0)');
    g.fillStyle=gr;g.fillRect(x-125,y-125,250,250);
  }
  // Fachadas: concreto, metal, janelas, dutos, escadas e letreiros pequenos.
  walls.forEach(([x,y,w,h],i)=>{
    if(y<0||x<0||x>=WW||y>=WH){g.fillStyle='#07090d';g.fillRect(x,y,w,h);return;}
    g.fillStyle='rgba(0,0,0,.42)';g.fillRect(x+7,y+9,w,h);
    g.fillStyle='#252a31';g.fillRect(x,y,w,h);
    g.fillStyle='#191e25';g.fillRect(x+5,y+5,w-10,h-10);
    g.strokeStyle='rgba(120,135,145,.28)';g.lineWidth=2;g.strokeRect(x+3,y+3,w-6,h-6);
    // placas de revestimento e vigas
    g.strokeStyle='rgba(0,0,0,.32)';g.lineWidth=2;
    for(let xx=x+18;xx<x+w-10;xx+=42){g.beginPath();g.moveTo(xx,y+8);g.lineTo(xx,y+h-8);g.stroke();}
    for(let yy=y+35;yy<y+h-12;yy+=48){g.beginPath();g.moveTo(x+8,yy);g.lineTo(x+w-8,yy);g.stroke();}
    // janelas em módulos, algumas apagadas
    for(let yy=y+14;yy<y+h-18;yy+=30)for(let xx=x+14;xx<x+w-14;xx+=32){
      const lit=R();
      g.fillStyle=lit<.28?'#101820':lit<.62?'#34434a':'#29333b';
      g.fillRect(xx,yy,19,12);
      if(lit>.62){g.fillStyle=lit>.88?'rgba(218,174,104,.55)':'rgba(83,157,165,.42)';g.fillRect(xx+2,yy+2,15,8);}
      g.strokeStyle='rgba(0,0,0,.55)';g.strokeRect(xx,yy,19,12);
    }
    // duto externo e pequenas luzes de serviço
    g.fillStyle='#090d12';g.fillRect(x+w-15,y+9,7,h-18);
    g.fillStyle='#59636a';g.fillRect(x+w-14,y+9,2,h-18);
    g.fillStyle=i%3===0?'rgba(0,196,205,.55)':'rgba(198,91,151,.42)';
    g.fillRect(x+10,y+10,Math.min(36,w-20),3);
    // escotilhas / portas de manutenção
    if(w>75&&h>75){g.fillStyle='#0c1117';g.fillRect(x+w/2-13,y+h-37,26,31);g.strokeStyle='#515b62';g.strokeRect(x+w/2-13,y+h-37,26,31);}
  });
}

function reset(){
  P={x:WW/2,y:WH/2,r:14,hp:CFG.playerHP,face:1,vx:0,vy:0,fireT:0,ammo:CFG.ammoMax,reloadT:0,inv:0,shootAnim:0,anim:0,moving:false,kx_:0,ky_:0,jumpT:0,jumpCd:0,hpG:CFG.playerHP,gT:0,regenT:30};
  enemies=[];bolts=[];floaters=[];sparks=[];kills=0;state='play';shake=0;blasts=[];skill={cd:0,aiming:false,deny:0};
  // espalha os inimigos pelo mapa (livres de paredes, longe do início e uns dos outros), tipos em rodízio
  const mix=['atk','hyb','def','atk','hyb','atk','def'];let tries=0;
  while(enemies.length<CFG.malwareCount&&tries++<6000){
    const x=120+Math.random()*(WW-240),y=120+Math.random()*(WH-240);
    if(hitsWall(x,y,44)||Math.hypot(x-P.x,y-P.y)<520||enemies.some(o=>Math.hypot(o.x-x,o.y-y)<170))continue;
    enemies.push(newMalware(x,y,mix[enemies.length%mix.length]));
  }
  cam.x=P.x-VW/2;cam.y=P.y-VH/2;
}
function newMalware(x,y,type){
  const T=ETYPES[type],hp=Math.round((T.hp[0]+Math.random()*(T.hp[1]-T.hp[0]))/5)*5; // vida aleatória (múltiplos de 5)
  return{type,t:T,x,y,px:x,py:y,leash:150,r:T.r,hp,maxHp:hp,hpG:hp,dmg:T.dmg,vx:0,vy:0,hitT:0,flash:0,anim:Math.random()*4,state:'idle',tx:x,ty:y,wait:Math.random()*2,kx:0,ky:0,dead:false,bob:Math.random()*6,
    shield:0,shCd:Math.random()*2,alert:0,lungeT:0,lungeCd:Math.random()*2,lx:0,ly:0}}

/* ============ COLISÃO ============ */
function hitsWall(x,y,r){
  for(const [wx,wy,ww,wh] of walls){
    const cx=Math.max(wx,Math.min(x,wx+ww)),cy=Math.max(wy,Math.min(y,wy+wh));
    if((x-cx)**2+(y-cy)**2<r*r)return true;}
  return false;
}
function moveEntity(e,dx,dy){ // movimento por eixo → desliza nas paredes
  if(!hitsWall(e.x+dx,e.y,e.r))e.x+=dx;
  if(!hitsWall(e.x,e.y+dy,e.r))e.y+=dy;
}

/* ============ ÁUDIO (efeitos sintetizados com Web Audio) ============ */
let actx=null,master=null,muted=false,sv=1;
function audioInit(){
  if(actx){if(actx.state==='suspended')actx.resume();return;}
  try{const AC=window.AudioContext||window.webkitAudioContext;actx=new AC();master=actx.createGain();master.gain.value=muted?0:0.5;master.connect(actx.destination);}catch(e){actx=null;}
}
addEventListener('keydown',audioInit);addEventListener('mousedown',audioInit);
function tone(type,f0,f1,dur,vol,delay){
  if(!actx||muted)return;
  const t=actx.currentTime+(delay||0),o=actx.createOscillator(),g=actx.createGain(),v=Math.max(0.0003,vol*sv);
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.03);
}
function noiseBurst(dur,vol,f0,f1,delay){
  if(!actx||muted)return;
  const n=Math.floor(actx.sampleRate*dur),buf=actx.createBuffer(1,n,actx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const src=actx.createBufferSource();src.buffer=buf;
  const f=actx.createBiquadFilter(),g=actx.createGain(),t=actx.currentTime+(delay||0);
  f.type='lowpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+dur);
  g.gain.setValueAtTime(Math.max(0.0003,vol*sv),t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f);f.connect(g);g.connect(master);src.start(t);
}

function startWeaponReloadAudio() {
  if (muted) return;
  try {
    reloadLoopAudio.pause();
    reloadLoopAudio.currentTime = 0;
    reloadLoopAudio.loop = true;
    const p = reloadLoopAudio.play();
    if (p && p.catch) p.catch(()=>{});
  } catch(e) {}
}
function stopWeaponReloadAudio() {
  try { reloadLoopAudio.pause(); reloadLoopAudio.currentTime = 0; } catch(e) {}
}
function playLightningStrikeAudio() {
  if (muted) return;
  try {
    const a = lightningStrikeAudio.cloneNode(true);
    a.volume = lightningStrikeAudio.volume;
    const p = a.play();
    if (p && p.catch) p.catch(()=>{});
  } catch(e) {}
}

// x,y opcionais: o volume cai com a distância do jogador
function sfx(name,x,y){
  sv=1;
  if(x!==undefined&&P){sv=Math.max(0,1-Math.hypot(x-P.x,y-P.y)/800);if(sv<0.04)return;}
  try{SFX[name]&&SFX[name]();}catch(e){}
}

/* ============ LÓGICA ============ */
function update(dt){
  time+=dt;
  if(state==='play')updatePlayer(dt);
  for(const m of enemies)updateMalware(m,dt);
  updateBolts(dt);
  updateSkill(dt);
  if(P){
    if(state==='play'){
      P.regenT-=dt;
      if(P.regenT<=0){
        if(P.hp<CFG.playerHP){
          const healed=Math.min(10,CFG.playerHP-P.hp);
          P.hp+=healed;
          floaters.push({x:P.x,y:P.y-70,t:1,txt:'+'+healed,c:'#00ff9c'});
          burst(P.x,P.y-30,'#00ff9c',8);
        }
        P.regenT=30;
      }
    }
    if(P.hpG>P.hp){P.gT-=dt;if(P.gT<=0)P.hpG=Math.max(P.hp,P.hpG-70*dt);}else P.hpG=P.hp;
  }
  enemies=enemies.filter(m=>!m.dead);
  for(const f of floaters){f.t-=dt;f.y-=36*dt;}floaters=floaters.filter(f=>f.t>0);
  for(const s of sparks){s.t-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;}sparks=sparks.filter(s=>s.t>0);
  if(state==='play'&&enemies.length===0){state='win';sfx('win');}
  shake=Math.max(0,shake-dt*30);
  // câmera suave com limites do mundo
  const tx=Math.max(0,Math.min(WW-VW,P.x-VW/2)),ty=Math.max(0,Math.min(WH-VH,P.y-VH/2));
  cam.x+=(tx-cam.x)*Math.min(1,dt*8);cam.y+=(ty-cam.y)*Math.min(1,dt*8);
}
function updatePlayer(dt){
  let ax=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joystick.x;
  let ay=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+joystick.y;
  const len=Math.hypot(ax,ay);
  P.moving=len>0;
  if(P.jumpT>0){P.jumpT=Math.max(0,P.jumpT-dt);if(P.jumpT===0)P.jumpCd=CFG.jumpCooldown;}
  P.jumpCd=Math.max(0,P.jumpCd-dt);
  P.z=P.jumpT>0?Math.sin((1-P.jumpT/CFG.jumpTime)*Math.PI)*CFG.jumpHeight:0;
  if(len>0){ax/=len;ay/=len;}                      // diagonal não é mais rápida
  let sp=CFG.playerSpeed*(P.jumpT>0?1.15:1);
  P.vx=ax*sp+P.kx_;P.vy=ay*sp+P.ky_;
  P.kx_*=Math.max(0,1-dt*9);P.ky_*=Math.max(0,1-dt*9);
  moveEntity(P,P.vx*dt,P.vy*dt);
  P.inv=Math.max(0,P.inv-dt);P.fireT=Math.max(0,P.fireT-dt);P.shootAnim=Math.max(0,P.shootAnim-dt);
  if(P.reloadT>0){P.reloadT=Math.max(0,P.reloadT-dt);if(P.reloadT===0){stopWeaponReloadAudio();P.ammo=CFG.ammoMax;sfx('reloaded');}}
  P.anim+=dt*(P.moving?10:4);
  // Direção visual acompanha o movimento horizontal, tanto no teclado quanto no analógico.
  // Assim, ao trocar de esquerda para direita (ou vice-versa), a animação vira imediatamente.
  const wx=mouse.x+cam.x,wy=mouse.y+cam.y;
  if(Math.abs(ax)>.12){
    P.face=ax>0?1:-1;
  }
  if(mobileFire)setMobileAim();
  const shotX=mobileFire?mouse.x+cam.x:wx,shotY=mobileFire?mouse.y+cam.y:wy;
  if((mouse.down||keys.KeyJ||mobileFire)&&!skill.aiming&&P.fireT<=0&&P.reloadT<=0&&P.ammo>0)shoot(shotX,shotY);
  // contato com Malware
  for(const m of enemies){
    if(m.dead)continue;
    if(Math.hypot(m.x-P.x,m.y-P.y)<m.r+P.r-2&&m.hitT<=0&&P.z<10){
      if(m.dmg>0)hurtPlayer(m.dmg,m);
      else{const a=Math.atan2(P.y-m.y,P.x-m.x);P.kx_=Math.cos(a)*CFG.knockback*1.2;P.ky_=Math.sin(a)*CFG.knockback*1.2;burst(P.x,P.y-20,'#3da5ff',6);} // defensor só empurra
      m.hitT=CFG.malwareHitCooldown;}
  }
}
function doJump(){
  if(!P||state!=='play'||paused||P.jumpT>0||P.jumpCd>0)return;
  P.jumpT=CFG.jumpTime;sfx('jump');
}

weaponShotAudio.preload = "auto";
weaponShotAudio.volume = 0.7;
function playWeaponShotSound(){
  if(muted)return;
  try {
    // cópia a cada tiro: o fim de um som não é cortado pelo próximo
    const a = weaponShotAudio.cloneNode(true);
    a.volume = weaponShotAudio.volume;
    const playback = a.play();
    if (playback && playback.catch) playback.catch(()=>{});
  } catch(e) {}
}

function shoot(wx,wy){
  if(P.ammo<=0||P.reloadT>0)return;
  playWeaponShotSound();
  P.ammo--;
  P.fireT=CFG.fireCooldown;P.shootAnim=0.28;
  let a=Math.atan2(wy-(P.y-34),wx-P.x);
  bolts.push({x:P.x+P.face*30,y:P.y-34,vx:Math.cos(a)*CFG.boltSpeed,vy:Math.sin(a)*CFG.boltSpeed,t:CFG.boltLife,a});
}
function hurtPlayer(d,src){
  if(P.inv>0||state!=='play')return;
  P.hp=Math.max(0,P.hp-d);P.inv=CFG.invulnTime;shake=10;P.gT=0.5;sfx('hurt');
  const a=Math.atan2(P.y-src.y,P.x-src.x);P.kx_=Math.cos(a)*CFG.knockback;P.ky_=Math.sin(a)*CFG.knockback;
  floaters.push({x:P.x,y:P.y-70,t:0.9,txt:'-'+d,c:'#ff3b6b'});
  burst(P.x,P.y-30,'#ff3b6b',8);
  if(P.hp<=0){state='dead';sfx('dead');burst(P.x,P.y-30,'#00e5ff',26);}
}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=60+Math.random()*180;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0.3+Math.random()*0.35,c});}}
function updateMalware(m,dt){
  const T=m.t;
  m.anim+=dt*10;m.hitT=Math.max(0,m.hitT-dt);m.flash=Math.max(0,m.flash-dt);
  m.shield=Math.max(0,m.shield-dt);m.shCd=Math.max(0,m.shCd-dt);m.alert=Math.max(0,m.alert-dt);
  m.lungeT=Math.max(0,m.lungeT-dt);m.lungeCd=Math.max(0,m.lungeCd-dt);
  m.hpG=m.hpG>m.hp?Math.max(m.hp,m.hpG-m.maxHp*0.9*dt):m.hp;
  const d=Math.max(1,Math.hypot(P.x-m.x,P.y-m.y));
  let dx=0,dy=0,spMul=1,patrol=false;
  if(m.type==='def'){
    // DEFENSOR: não persegue. Fica perto do posto, se coloca entre o posto e o jogador e levanta o escudo em ciclos.
    const pd=Math.hypot(P.x-m.px,P.y-m.py),lim=m.state==='guard'?T.sight*1.6:T.sight;
    m.state=(state==='play'&&(pd<lim||m.alert>0))?'guard':'idle';
    if(m.state==='guard'){
      const k=Math.min(pd,m.leash)/Math.max(pd,1),tx=m.px+(P.x-m.px)*k,ty=m.py+(P.y-m.py)*k,dd=Math.hypot(tx-m.x,ty-m.y);
      if(dd>6){dx=(tx-m.x)/dd;dy=(ty-m.y)/dd;}
      if(m.shield<=0&&m.shCd<=0){m.shield=2.4;m.shCd=3.6;}   // 2,4s de escudo, ~1,2s vulnerável
    }else patrol=true;
  }else{
    // ATACANTE / HÍBRIDO: perseguem o jogador
    const lim=m.state==='chase'?T.sight*1.5:T.sight;
    m.state=(state==='play'&&(d<lim||m.alert>0))?'chase':'idle';
    if(m.state==='chase'){
      dx=(P.x-m.x)/d;dy=(P.y-m.y)/d;
      if(m.type==='atk'&&m.lungeT<=0&&m.lungeCd<=0&&d<180&&d>70){m.lungeT=0.35;m.lungeCd=2.6;m.lx=dx;m.ly=dy;} // investida
      if(m.lungeT>0){dx=m.lx;dy=m.ly;spMul=2.6;}
      if(m.shield>0)spMul*=0.5;                                  // híbrido com escudo anda devagar
    }else patrol=true;
  }
  if(patrol){ // patrulha: anda até um ponto próximo (do posto, se defensor), espera, escolhe outro
    m.wait-=dt;
    if(m.wait<=0){const bx=m.type==='def'?m.px:m.x,by=m.type==='def'?m.py:m.y,sp=m.type==='def'?150:220;
      m.tx=bx+(Math.random()-.5)*sp;m.ty=by+(Math.random()-.5)*sp;m.wait=1.5+Math.random()*2;}
    const dd=Math.hypot(m.tx-m.x,m.ty-m.y);if(dd>8){dx=(m.tx-m.x)/dd*0.45;dy=(m.ty-m.y)/dd*0.45;}
  }
  m.kx*=Math.max(0,1-dt*8);m.ky*=Math.max(0,1-dt*8);
  const sp=CFG.malwareSpeed*T.speed*spMul;
  moveEntity(m,(dx*sp+m.kx)*dt,(dy*sp+m.ky)*dt);
  // separação simples entre malwares
  for(const o of enemies){if(o===m||o.dead)continue;const ex=m.x-o.x,ey=m.y-o.y,dist=Math.hypot(ex,ey);
    if(dist>0&&dist<(m.r+o.r)*0.9){moveEntity(m,ex/dist*40*dt,ey/dist*40*dt);}}
  m.face=(P.x>m.x)?1:-1;
  if(Math.abs(dx)>0.05)m.face=dx>0?1:-1;
}
function updateBolts(dt){
  for(const b of bolts){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt;
    if(b.t<=0||b.x<0||b.y<0||b.x>WW||b.y>WH||hitsWall(b.x,b.y+34,3)){b.t=0;burst(b.x,b.y,'#00e5ff',4);continue;}
    for(const m of enemies){
      if(m.dead)continue;
      // o projétil voa na altura do peito (y-34); o malware é checado no corpo dele
      if(Math.hypot(b.x-m.x,(b.y+34)-m.y)<m.r+8||Math.hypot(b.x-m.x,b.y-(m.y-28))<m.r+8){
        hitMalware(m,CFG.playerDmg,b);b.t=0;break;}
    }
  }
  bolts=bolts.filter(b=>b.t>0);
}
function hitMalware(m,d,b){
  const shielded=m.shield>0;
  const dmg=shielded?Math.max(1,Math.round(d*(b.skill?0.6:0.3))):d;   // escudo absorve 70% do tiro (40% da Sobrecarga)
  m.hp-=dmg;m.flash=0.12;
  const kb=m.type==='def'?0.25:0.6;
  m.kx=Math.sign(b.vx)*CFG.knockback*kb;m.ky=Math.sign(b.vy)*CFG.knockback*kb;
  m.alert=3;m.state=m.type==='def'?'guard':'chase';
  if(m.type==='hyb'&&m.shield<=0&&m.shCd<=0){m.shield=1.3;m.shCd=3.8;}  // híbrido reage ao ser atingido
  floaters.push({x:m.x,y:m.y-40-m.t.scale*20,t:0.7,txt:String(dmg),c:shielded?'#9fb8ff':'#00e5ff'});
  sfx(m.hp<=0?'kill':shielded?'shieldHit':'hit',m.x,m.y);
  burst(b.x,b.y,shielded?'#9fb8ff':'#00e5ff',7);
  if(m.hp<=0){m.dead=true;kills++;burst(m.x,m.y-10,m.t.color,22);burst(m.x,m.y-10,'#ffcc00',10);}
}

/* ============ HABILIDADE ESPECIAL: SOBRECARGA ============ */
function overIcon(){const cx=ICON.x+ICON.s/2,cy=ICON.y+ICON.s/2;return Math.hypot(mouse.x-cx,mouse.y-cy)<=ICON.s/2;}
function toggleAim(){
  if(!P||paused||state!=='play')return;
  if(skill.aiming){skill.aiming=false;sfx('aimOff');return;}
  if(skill.cd>0){skill.deny=0.3;sfx('deny');return;}      // ainda recarregando
  skill.aiming=true;mouse.down=false;sfx('aimOn');
}
// posição da mira no mundo, limitada ao alcance máximo a partir do jogador
function aimTarget(){
  const wx=mouse.x+cam.x,wy=mouse.y+cam.y;
  let dx=wx-P.x,dy=wy-P.y;const d=Math.hypot(dx,dy);
  if(d>SKILL.range){dx=dx/d*SKILL.range;dy=dy/d*SKILL.range;}
  return{x:P.x+dx,y:P.y+dy};
}
function confirmAim(){
  if(!skill.aiming||skill.cd>0||state!=='play')return;
  const T=aimTarget();
  blasts.push({x:T.x,y:T.y,t:SKILL.delay,fired:false,fx:0});
  skill.aiming=false;skill.cd=SKILL.cooldown;sfx('cast');
  P.face=T.x>=P.x?1:-1;P.shootAnim=0.28;
}
function updateSkill(dt){
  const cd0=skill.cd;skill.cd=Math.max(0,skill.cd-dt);skill.deny=Math.max(0,skill.deny-dt);
  if(cd0>0&&skill.cd===0)sfx('ready');
  if(state!=='play')skill.aiming=false;
  for(const b of blasts){
    if(!b.fired){b.t-=dt;if(b.t<=0)detonate(b);}
    else b.fx-=dt;
  }
  blasts=blasts.filter(b=>!b.fired||b.fx>0);
}
function detonate(b){
  b.fired=true;b.fx=SKILL.fxTime;shake=16;playLightningStrikeAudio();sfx('boom',b.x,b.y);
  burst(b.x,b.y,'#ff2fb3',26);burst(b.x,b.y,'#00e5ff',18);
  for(const m of enemies){
    if(m.dead)continue;
    if(Math.hypot(m.x-b.x,m.y-b.y)<SKILL.radius+m.r*0.5){
      const a=Math.atan2(m.y-b.y,m.x-b.x);
      hitMalware(m,SKILL.dmg,{x:m.x,y:m.y-10,vx:Math.cos(a),vy:Math.sin(a),skill:true});
      if(!m.dead){m.kx=Math.cos(a)*CFG.knockback*1.4;m.ky=Math.sin(a)*CFG.knockback*1.4;}
    }
  }
}

/* ============ DESENHO ============ */
function drawSheet(key,frame,x,y,scale,flip,anchor){
  const s=SPR[key],img=IMG[key];
  const dw=s.w*scale,dh=s.h*scale;
  ctx.save();ctx.translate(x,y);if(flip)ctx.scale(-1,1);
  ctx.drawImage(img,frame*s.w,0,s.w,s.h,-dw/2,-dh,dw,dh);
  ctx.restore();
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,VW,VH);
  const sx=shake?(Math.random()-.5)*shake*.6:0,sy=shake?(Math.random()-.5)*shake*.6:0;
  ctx.translate(Math.round(-cam.x+sx),Math.round(-cam.y+sy));
  {const fx=Math.max(0,Math.floor(cam.x)-40),fy=Math.max(0,Math.floor(cam.y)-40),fw=Math.min(VW+80,WW-fx),fh=Math.min(VH+80,WH-fy);
   ctx.drawImage(floorCanvas,fx,fy,fw,fh,fx,fy,fw,fh);}
  drawGroundSkill();
  // entidades ordenadas por Y (profundidade top-down)
  const list=[];
  for(const m of enemies)if(m.x>cam.x-120&&m.x<cam.x+VW+120&&m.y>cam.y-140&&m.y<cam.y+VH+120)list.push({y:m.y,f:()=>drawMalware(m)});
  list.push({y:P.y,f:drawPlayer});
  list.sort((a,b)=>a.y-b.y);list.forEach(o=>o.f());
  // projéteis
  ctx.globalCompositeOperation='lighter';
  for(const b of bolts){const g=ctx.createRadialGradient(b.x,b.y,1,b.x,b.y,14);
    g.addColorStop(0,'rgba(180,255,255,1)');g.addColorStop(.4,'rgba(0,229,255,.7)');g.addColorStop(1,'rgba(0,229,255,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,14,0,7);ctx.fill();
    ctx.strokeStyle='rgba(0,229,255,.6)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.vx*0.035,b.y-b.vy*0.035);ctx.stroke();}
  for(const s of sparks){ctx.globalAlpha=Math.max(0,s.t*2.2);ctx.fillStyle=s.c;ctx.fillRect(s.x-2,s.y-2,4,4);}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  drawBlastFX();
  // números de dano
  ctx.font='bold 18px system-ui,Arial';ctx.textAlign='center';
  for(const f of floaters){ctx.globalAlpha=Math.min(1,f.t*2);ctx.fillStyle='#000';ctx.fillText(f.txt,f.x+1,f.y+1);ctx.fillStyle=f.c;ctx.fillText(f.txt,f.x,f.y);}
  ctx.globalAlpha=1;
  if(showBoxes){ctx.strokeStyle='#0f0';ctx.lineWidth=1;
    walls.forEach(w=>ctx.strokeRect(...w));
    ctx.beginPath();ctx.arc(P.x,P.y,P.r,0,7);ctx.stroke();
    enemies.forEach(m=>{ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,7);ctx.stroke();});}
  ctx.setTransform(1,0,0,1,0,0);
  drawHUD();
}

// zonas de aviso + área de mira (no chão, abaixo dos personagens)
function drawGroundSkill(){
  const R=SKILL.radius;
  for(const b of blasts){
    if(b.fired)continue;
    const p=1-b.t/SKILL.delay;
    ctx.save();
    ctx.fillStyle='rgba(255,47,179,'+(0.10+0.16*p)+')';ctx.beginPath();ctx.arc(b.x,b.y,R,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,80,120,'+(0.22+0.3*p)+')';ctx.beginPath();ctx.arc(b.x,b.y,R*p,0,7);ctx.fill();
    ctx.strokeStyle='#ff2fb3';ctx.shadowColor='#ff2fb3';ctx.shadowBlur=14;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(b.x,b.y,R,0,7);ctx.stroke();
    ctx.restore();
  }
  if(!skill.aiming)return;
  const T=aimTarget(),pulse=0.5+0.5*Math.sin(time*8);
  ctx.save();
  // anel de alcance máximo ao redor do jogador
  ctx.strokeStyle='rgba(0,229,255,.35)';ctx.lineWidth=2;ctx.setLineDash([10,10]);ctx.lineDashOffset=-time*24;
  ctx.beginPath();ctx.arc(P.x,P.y,SKILL.range,0,7);ctx.stroke();
  // linha do jogador até a área
  ctx.setLineDash([6,8]);ctx.strokeStyle='rgba(255,47,179,.55)';
  ctx.beginPath();ctx.moveTo(P.x,P.y);ctx.lineTo(T.x,T.y);ctx.stroke();
  ctx.setLineDash([]);
  // Novo marcador circular roxo enviado pelo jogador (sem a mira antiga nem o X)
  const aimSize=R*2.35*(1+0.025*Math.sin(time*6));
  if(skillAimImg.complete&&skillAimImg.naturalWidth){
    ctx.save();ctx.globalAlpha=0.95;
    ctx.drawImage(skillAimImg,T.x-aimSize/2,T.y-aimSize/2,aimSize,aimSize);
    ctx.restore();
  }
  // marca os inimigos que serão atingidos
  let n=0;
  for(const m of enemies){
    if(m.dead||Math.hypot(m.x-T.x,m.y-T.y)>=R+m.r*0.5)continue;
    n++;
    ctx.strokeStyle='#ff3b6b';ctx.shadowColor='#ff3b6b';ctx.shadowBlur=10;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.ellipse(m.x,m.y+2,m.r+10,(m.r+10)*0.45,0,0,7);ctx.stroke();
  }
  ctx.shadowBlur=0;
  if(n>0){ctx.font='bold 13px system-ui,Arial';ctx.textAlign='center';ctx.fillStyle='#000';ctx.fillText(n+(n===1?' alvo':' alvos'),T.x+1,T.y-R-14);ctx.fillStyle='#ff6b8a';ctx.fillText(n+(n===1?' alvo':' alvos'),T.x,T.y-R-15);}
  ctx.restore();
}
// explosão (por cima de tudo)
function drawBlastFX(){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const b of blasts){
    if(!b.fired)continue;
    const p=1-b.fx/SKILL.fxTime,R=SKILL.radius,k=1-p;
    // feixe de energia caindo do alto
    const bw=44*k+6,bg=ctx.createLinearGradient(0,b.y-340,0,b.y);
    bg.addColorStop(0,'rgba(0,229,255,0)');bg.addColorStop(1,'rgba(200,255,255,'+(0.85*k)+')');
    ctx.fillStyle=bg;ctx.fillRect(b.x-bw/2,b.y-340,bw,340);
    // clarão
    const rr=R*(0.6+0.6*p),g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,rr);
    g.addColorStop(0,'rgba(255,255,255,'+(0.9*k)+')');g.addColorStop(.5,'rgba(255,47,179,'+(0.55*k)+')');g.addColorStop(1,'rgba(255,47,179,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,rr,0,7);ctx.fill();
    // onda de choque
    ctx.strokeStyle='rgba(0,229,255,'+k+')';ctx.lineWidth=6*k+1;
    ctx.beginPath();ctx.arc(b.x,b.y,R*(0.3+1.1*p),0,7);ctx.stroke();
  }
  ctx.restore();
}
// ícone da habilidade no HUD
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawSkillIcon(){
  const {x,y,s}=ICON,ready=skill.cd<=0,hov=overIcon(),cx=x+s/2,cy=y+s/2;
  cv.style.cursor=hov?'pointer':(skill.aiming?'crosshair':'');
  const col=skill.aiming?'#ffd34e':ready?'#00e5ff':'#68738d';
  ctx.save();
  if(skill.deny>0)ctx.translate(Math.sin(skill.deny*70)*3,0);
  // Ícone circular com a arte enviada pelo jogador
  ctx.save();ctx.beginPath();ctx.arc(cx,cy,s/2,0,Math.PI*2);ctx.clip();
  ctx.fillStyle='#050a18';ctx.fillRect(x,y,s,s);
  if(skillIconImg.complete&&skillIconImg.naturalWidth){ctx.drawImage(skillIconImg,x,y,s,s);}
  else {ctx.fillStyle='#00e5ff';ctx.font='bold 34px system-ui';ctx.textAlign='center';ctx.fillText('⚡',cx,cy+12);}
  if(hov&&ready){ctx.fillStyle='rgba(0,229,255,.18)';ctx.fillRect(x,y,s,s);}
  ctx.restore();
  // Recarga: máscara radial escura sobre a imagem
  if(!ready){
    ctx.save();ctx.beginPath();ctx.arc(cx,cy,s/2,0,Math.PI*2);ctx.clip();
    ctx.fillStyle='rgba(0,0,0,.68)';ctx.beginPath();ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,s/2,-Math.PI/2,-Math.PI/2+Math.PI*2*(skill.cd/SKILL.cooldown));ctx.closePath();ctx.fill();
    ctx.restore();
    ctx.fillStyle='#fff';ctx.font='bold 22px system-ui,Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='#000';ctx.shadowBlur=5;ctx.fillText(Math.ceil(skill.cd),cx,cy);ctx.shadowBlur=0;ctx.textBaseline='alphabetic';
  }
  // Contorno circular neon
  ctx.beginPath();ctx.arc(cx,cy,s/2-1,0,Math.PI*2);ctx.strokeStyle=skill.deny>0?'#ff3b6b':col;
  ctx.shadowColor=col;ctx.shadowBlur=skill.aiming?18:ready?10+6*Math.sin(time*4):0;ctx.lineWidth=skill.aiming?3:2.5;ctx.stroke();ctx.shadowBlur=0;
  // Tecla Q
  ctx.beginPath();ctx.arc(x+s-9,y+s-8,9,0,Math.PI*2);ctx.fillStyle='#050a18';ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle=col;ctx.font='bold 11px system-ui,Arial';ctx.textAlign='center';ctx.fillText('Q',x+s-9,y+s-4);
  ctx.restore();
  ctx.fillStyle=ready?'#8df5ff':'#6c7190';ctx.font='bold 10px system-ui,Arial';ctx.textAlign='center';ctx.fillText('SOBRECARGA',cx,y+s+14);
  ctx.textAlign='right';ctx.fillStyle='#6a8aa8';ctx.font='11px system-ui,Arial';
  ctx.fillText('Q / ícone: Sobrecarga (mirar → clicar para lançar · botão direito/Esc cancela)',VW-20,VH-26);
  if(skill.aiming){ctx.textAlign='center';ctx.font='bold 14px system-ui,Arial';ctx.fillStyle='#ffd34e';ctx.shadowColor='#ffd34e';ctx.shadowBlur=8;ctx.fillText('Clique para atacar · Botão direito cancela',VW/2,34);ctx.shadowBlur=0;}
}
function drawPlayer(){
  // sombra
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(P.x,P.y+2,22-(P.z||0)*0.12,8-(P.z||0)*0.05,0,0,7);ctx.fill();
  if(P.inv>0&&Math.floor(P.inv*16)%2===0&&state==='play')ctx.globalAlpha=.45;
  if(state==='dead')ctx.globalAlpha=.35;
  const sc=0.75,zz=P.z||0;
  if(P.jumpT>0&&P.shootAnim<=0){const f=Math.min(3,Math.floor((1-P.jumpT/CFG.jumpTime)*4));drawSheet('jump',f,P.x,P.y+6-zz,sc,P.face<0);}
  else if(P.shootAnim>0){const t=1-P.shootAnim/0.28;const seq=[2,3,4,5,0];drawSheet('shoot',seq[Math.min(4,Math.floor(t*5))],P.x,P.y+6-zz,sc,P.face<0);}
  else if(P.moving)drawSheet('walk',Math.floor(P.anim)%4,P.x,P.y+6,sc,P.face<0);
  else drawSheet('idle',Math.floor(P.anim)%4,P.x,P.y+6,sc,P.face<0);
  ctx.globalAlpha=1;
}
function drawMalware(m){
  const T=m.t,sc=T.scale,bob=Math.sin(time*5+m.bob)*3;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(m.x,m.y+4,m.r+2,m.r*0.38,0,0,7);ctx.fill();
  // aura colorida no chão (identifica o tipo)
  ctx.save();ctx.globalAlpha=0.35;ctx.strokeStyle=T.color;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(m.x,m.y+4,m.r+7,(m.r+7)*0.4,0,0,7);ctx.stroke();ctx.restore();
  ctx.imageSmoothingEnabled=false;
  ctx.save();
  if(m.flash>0)ctx.filter='brightness(3)';
  drawSheet('m_'+m.type,Math.floor(m.anim)%4,m.x,m.y-6+bob,sc,m.face>0);
  ctx.restore();ctx.imageSmoothingEnabled=true;
  // escudo
  if(m.shield>0){
    const a=Math.min(1,m.shield*3)*(0.6+0.25*Math.sin(time*14)),cy=m.y-6-15*sc+bob,rad=sc*23;
    ctx.save();ctx.strokeStyle=T.color;ctx.shadowColor=T.color;ctx.shadowBlur=14;ctx.lineWidth=3;ctx.globalAlpha=a;
    ctx.beginPath();ctx.arc(m.x,cy,rad,0,7);ctx.stroke();
    ctx.globalAlpha=a*0.2;ctx.fillStyle=T.color;ctx.fill();
    ctx.globalAlpha=a*0.7;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(m.x,cy,rad*0.78,time*3,time*3+2.2);ctx.stroke();
    ctx.restore();
  }
  // barra de vida do inimigo: moldura na cor do tipo, rastro de dano, divisões a cada 10 HP, tag e números
  const w=Math.round(34+sc*10),h=7,x=Math.round(m.x-w/2),y=Math.round(m.y-6-30*sc-16),ratio=Math.max(0,m.hp/m.maxHp);
  ctx.fillStyle='rgba(4,8,20,.85)';ctx.fillRect(x-2,y-2,w+4,h+4);
  ctx.strokeStyle=T.color;ctx.lineWidth=1.5;ctx.strokeRect(x-2,y-2,w+4,h+4);
  ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillRect(x,y,w*Math.max(0,m.hpG/m.maxHp),h);
  const gr=ctx.createLinearGradient(x,0,x+w,0);gr.addColorStop(0,T.color);gr.addColorStop(1,'#ffffff55');
  ctx.fillStyle=T.color;ctx.fillRect(x,y,w*ratio,h);
  ctx.fillStyle='rgba(255,255,255,.22)';ctx.fillRect(x,y,w*ratio,h*0.4);
  ctx.fillStyle='rgba(0,0,0,.55)';for(let v=10;v<m.maxHp;v+=10)ctx.fillRect(x+w*v/m.maxHp-0.5,y,1,h);
  ctx.font='bold 10px system-ui,Arial';ctx.textAlign='center';
  ctx.fillStyle='#000';ctx.fillText(T.tag+'  '+Math.max(0,m.hp)+'/'+m.maxHp,m.x+1,y-5);
  ctx.fillStyle=T.color;ctx.fillText(T.tag,m.x-(ctx.measureText('  '+Math.max(0,m.hp)+'/'+m.maxHp).width)/2,y-6);
  ctx.fillStyle='#fff';ctx.fillText(Math.max(0,m.hp)+'/'+m.maxHp,m.x+(ctx.measureText(T.tag+'  ').width)/2,y-6);
}
function bar(x,y,w,h,v,c1,c2,label){
  ctx.fillStyle='rgba(5,10,24,.75)';ctx.fillRect(x-4,y-4,w+8,h+8);
  ctx.strokeStyle=c1;ctx.shadowColor=c1;ctx.shadowBlur=8;ctx.lineWidth=2;ctx.strokeRect(x-4,y-4,w+8,h+8);ctx.shadowBlur=0;
  const g=ctx.createLinearGradient(x,0,x+w,0);g.addColorStop(0,c2);g.addColorStop(1,c1);
  ctx.fillStyle=g;ctx.fillRect(x,y,w*Math.max(0,v),h);
  ctx.fillStyle='#fff';ctx.font='bold 13px system-ui,Arial';ctx.textAlign='left';ctx.fillText(label,x+8,y+h-6);
}
function skewPath(x,y,w,h,k){ctx.beginPath();ctx.moveTo(x+k,y);ctx.lineTo(x+w+k,y);ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h);ctx.closePath();}
function drawHealth(){
  const x=60,y=26,w=250,h=24,k=10,r=Math.max(0,P.hp/CFG.playerHP),rg=Math.max(0,P.hpG/CFG.playerHP);
  const low=r<=0.3&&state==='play',pulse=0.5+0.5*Math.sin(time*7),flash=P.inv>CFG.invulnTime*0.75;
  const c1=r>0.6?'#00ff9c':r>0.3?'#ffd34e':'#ff3b6b',c2=r>0.6?'#00b3d6':r>0.3?'#ff9a3c':'#aa0030';
  // vinheta vermelha quando a vida está baixa
  if(low){const vg=ctx.createRadialGradient(VW/2,VH/2,VH*0.35,VW/2,VH/2,VW*0.65);
    vg.addColorStop(0,'rgba(255,0,60,0)');vg.addColorStop(1,'rgba(255,0,60,'+(0.18+0.22*pulse)+')');ctx.fillStyle=vg;ctx.fillRect(0,0,VW,VH);}
  ctx.save();
  // moldura + fundo inclinados
  skewPath(x-4,y-4,w+8,h+8,k);ctx.fillStyle='rgba(5,10,24,.85)';ctx.fill();
  // rastro do dano (branco → some devagar)
  ctx.save();skewPath(x,y,w,h,k);ctx.clip();
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(x-2,y,(w+k)*rg,h);
  // preenchimento principal
  const g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,c1);g.addColorStop(1,c2);
  ctx.fillStyle=g;ctx.fillRect(x-2,y,(w+k)*r,h);
  ctx.fillStyle='rgba(255,255,255,.22)';ctx.fillRect(x-2,y,(w+k)*r,h*0.42);            // brilho
  ctx.fillStyle='rgba(0,0,0,.35)';for(let v=10;v<CFG.playerHP;v+=10)ctx.fillRect(x+(w+k)*v/CFG.playerHP-1,y,1.5,h); // divisões
  if(flash){ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(x-2,y,w+k+2,h);}
  ctx.restore();
  // borda neon (pisca em vermelho quando crítica)
  const bc=low?'rgba(255,59,107,'+(0.6+0.4*pulse)+')':c1;
  skewPath(x-4,y-4,w+8,h+8,k);ctx.strokeStyle=bc;ctx.shadowColor=bc;ctx.shadowBlur=low?18:10;ctx.lineWidth=2;ctx.stroke();ctx.shadowBlur=0;
  // texto
  ctx.font='bold 12px system-ui,Arial';ctx.textAlign='left';ctx.fillStyle='#000';ctx.fillText('VIDA',x+10,y+16);ctx.fillStyle='#fff';ctx.fillText('VIDA',x+9,y+15);
  ctx.font='bold 15px system-ui,Arial';ctx.textAlign='right';const t=Math.ceil(P.hp)+' / '+CFG.playerHP;
  ctx.fillStyle='#000';ctx.fillText(t,x+w-3,y+18);ctx.fillStyle='#fff';ctx.fillText(t,x+w-4,y+17);
  // emblema (coração) no lado esquerdo
  const bx=34,by=y+h/2,s=1+(low?0.12*pulse:0);
  ctx.beginPath();ctx.arc(bx,by,19,0,7);ctx.fillStyle='rgba(5,10,24,.9)';ctx.fill();ctx.strokeStyle=bc;ctx.shadowColor=bc;ctx.shadowBlur=10;ctx.lineWidth=2.5;ctx.stroke();ctx.shadowBlur=0;
  ctx.save();ctx.translate(bx,by+1);ctx.scale(s,s);ctx.fillStyle=c1;ctx.beginPath();
  ctx.moveTo(0,8);ctx.bezierCurveTo(-14,-1,-8,-11,0,-5);ctx.bezierCurveTo(8,-11,14,-1,0,8);ctx.fill();ctx.restore();
  ctx.restore();
}
function drawHUD(){
  const v=P.hp/CFG.playerHP;
  drawHealth();
  const ammoProgress=P.reloadT>0?1-P.reloadT/CFG.reloadTime:P.ammo/CFG.ammoMax;
  bar(24,66,180,14,ammoProgress,'#ffd34e','#9b6411',P.reloadT>0?'RECARREGANDO':(P.ammo===0?'SEM MUNIÇÃO - APERTE R':'MUNIÇÃO  '+P.ammo+' / '+CFG.ammoMax));
  ctx.fillStyle='#9fd8ff';ctx.font='13px system-ui,Arial';ctx.textAlign='left';
  ctx.fillText('KAYZEN RYUU',24,102);
  ctx.fillText('Malwares restantes: '+enemies.length+'   Destruídos: '+kills,24,120);
  {let lx=24;ctx.font='bold 11px system-ui,Arial';for(const k in ETYPES){const T=ETYPES[k];ctx.fillStyle=T.color;ctx.fillRect(lx,130,9,9);ctx.fillStyle='#9fd8ff';ctx.fillText(T.name,lx+13,139);lx+=ctx.measureText(T.name).width+26;}}
  ctx.textAlign='right';
  ctx.fillStyle='#6a8aa8';ctx.font='11px system-ui,Arial';
  ctx.fillText('WASD/Setas mover · Mouse mirar · Clique/J atirar · R recarregar · Espaço pular · M som · P pausa · H hitboxes',VW-20,VH-42);
  ctx.textAlign='left';ctx.fillText('Arte do Malware: "Dregfly" por Emcee Flesher (OpenGameArt, CC-BY/OGA-BY 3.0)',12,VH-10);
  // minimapa simples (preparado para fases futuras)
  const mw=190,mh=119,mx=VW-mw-18,my=50;
  ctx.fillStyle='rgba(5,10,24,.7)';ctx.fillRect(mx,my,mw,mh);ctx.strokeStyle='#0b6a80';ctx.strokeRect(mx,my,mw,mh);
  ctx.fillStyle='#16304a';walls.slice(4).forEach(([x,y,w,h])=>ctx.fillRect(mx+x/WW*mw,my+y/WH*mh,Math.max(2,w/WW*mw),Math.max(2,h/WH*mh)));
  enemies.forEach(m=>{ctx.fillStyle=m.t.color;ctx.fillRect(mx+m.x/WW*mw-1.5,my+m.y/WH*mh-1.5,3,3);});
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1;ctx.strokeRect(mx+cam.x/WW*mw,my+cam.y/WH*mh,VW/WW*mw,VH/WH*mh);
  ctx.fillStyle='#00e5ff';ctx.fillRect(mx+P.x/WW*mw-2,my+P.y/WH*mh-2,4,4);
  drawSkillIcon();
  if(paused||state!=='play'){
    ctx.fillStyle='rgba(2,4,12,.72)';ctx.fillRect(0,0,VW,VH);ctx.textAlign='center';
    ctx.shadowBlur=18;
    if(paused&&state==='play'){ctx.fillStyle='#00e5ff';ctx.shadowColor='#00e5ff';ctx.font='bold 44px system-ui,Arial';ctx.fillText('PAUSADO',VW/2,VH/2);ctx.shadowBlur=0;ctx.font='16px system-ui,Arial';ctx.fillStyle='#cfeaff';ctx.fillText('Pressione P para continuar',VW/2,VH/2+34);}
    else if(state==='dead'){ctx.fillStyle='#ff3b6b';ctx.shadowColor='#ff3b6b';ctx.font='bold 48px system-ui,Arial';ctx.fillText('SISTEMA COMPROMETIDO',VW/2,VH/2);ctx.shadowBlur=0;ctx.font='16px system-ui,Arial';ctx.fillStyle='#cfeaff';ctx.fillText('Pressione R para tentar novamente',VW/2,VH/2+36);}
    else if(state==='win'){ctx.fillStyle='#00ff9c';ctx.shadowColor='#00ff9c';ctx.font='bold 48px system-ui,Arial';ctx.fillText('ÁREA LIMPA',VW/2,VH/2);ctx.shadowBlur=0;ctx.font='16px system-ui,Arial';ctx.fillStyle='#cfeaff';ctx.fillText('Todos os Malwares destruídos. Pressione R para jogar de novo.',VW/2,VH/2+36);}
    ctx.shadowBlur=0;
  }
}
function loop(t){
  const dt=Math.min(0.05,(t-last)/1000||0);last=t;
  if(!paused)update(dt);
  draw();requestAnimationFrame(loop);
}
function start(){buildFloor();reset();requestAnimationFrame(loop);}
window.__game={get P(){return P},get enemies(){return enemies},get state(){return state},get skill(){return skill},get blasts(){return blasts},keys,CFG,SKILL};
</script>
